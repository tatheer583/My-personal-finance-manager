<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta
      name="description"
      content="Track income, expenses, budgets and savings with a fast, private, local-first personal finance manager."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Personal Finance Manager</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong colour scheme.
      (function () {
        try {
          var stored = localStorage.getItem('pfm.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersLight
                ? 'light'
                : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — keep the default dark theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This application requires JavaScript. Please enable it to continue.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
